
spring.application.name=healthdekho-backend

# Server
server.port=8081

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Spring AI - Amazon Bedrock
spring.ai.model.chat=bedrock-converse
spring.ai.bedrock.aws.region=${AWS_REGION:ap-south-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_CONVERSE_MODEL}
spring.ai.bedrock.converse.chat.options.max-tokens=1024
spring.ai.model.embedding=none
